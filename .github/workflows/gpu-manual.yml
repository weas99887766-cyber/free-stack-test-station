name: gpu-script-validate
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run gpu_test.py (CPU fallback expected)
        working-directory: gpu
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu || true
          python gpu_test.py
          cat result.json
